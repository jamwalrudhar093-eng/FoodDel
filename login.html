<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodDel - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff7a18, #ffb347);
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #ff6b00;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ff6b00;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ff6b00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e85d00;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #ff6b00;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🍔 FoodDel</div>

    <p class="subtitle">Login to order your favourite food</p>

    <form id="loginForm">

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">Login</button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
      ← Back to FoodDel
    </a>

  </div>

  <script>
    const API_URL = "https://fooddel-i1su.onrender.com";

    document.getElementById("loginForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      try {
        const response = await fetch(`${API_URL}/api/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Login failed");
        }

        localStorage.setItem("campusbite-user", JSON.stringify(data.user));

        message.textContent = "Login successful!";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 700);

      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>

</body>
</html>
